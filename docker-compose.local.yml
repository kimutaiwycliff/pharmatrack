# Fully-dockerized LOCAL run on Linux that mirrors the production app image
# (same Dockerfile build + Redis), minus Caddy/TLS (which needs a public domain).
#
# Easiest: `make up` writes .env and runs this for you (backend = Supabase CLI
# stack on :54321). The Supabase URL/keys come from the root .env, so this file
# works against either backend:
#   • make / Supabase CLI:      NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
#   • self-hosted compose:      NEXT_PUBLIC_SUPABASE_URL=http://localhost:8000
# Either way also set in .env (used for BOTH build and runtime):
#   NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
#   NEXT_PUBLIC_APP_URL=http://localhost:3000, REDIS_URL=redis://localhost:6379
#
# Manual invocation (web + redis only; Caddy/cron stay off):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build web redis
#
# Host networking lets the app container reach the backend + Redis on localhost
# and serve on http://localhost:3000 — a secure context, so the offline service
# worker still registers.

services:
  web:
    network_mode: host
    environment:
      # Host networking: reach Redis on localhost, not the bridge alias.
      REDIS_URL: redis://localhost:6379
  redis:
    network_mode: host
