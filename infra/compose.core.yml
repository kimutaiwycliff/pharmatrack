# PharmaTrack core stack (self-hosted). Data plane (postgres/redis/minio) runs by
# default; the app + worker are under the `app` profile. Use via the Makefile.
#
#   make up          # postgres + redis + minio
#   make db-migrate  # dbmate up (as app_owner)
#   make up-app      # + web, worker, caddy

name: pharmatrack

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pharmatrack}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-app_owner}
      APP_AUTHENTICATED_PASSWORD: ${APP_AUTHENTICATED_PASSWORD:-app_authenticated}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-56379}:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  # ── App plane (enable after cutover: `make up-app`) ──────────────────────────
  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN:-}
    image: pharmatrack-web:latest
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: "3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports:
      - "3000:3000"

  worker:
    profiles: ["app"]
    image: pharmatrack-web:latest
    restart: unless-stopped
    env_file: ../.env
    command: ["node", "apps/worker/server.js"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      web: { condition: service_healthy }

volumes:
  pg-data:
  redis-data:
  minio-data:
