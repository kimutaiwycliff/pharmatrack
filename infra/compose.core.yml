# PharmaTrack core stack (self-hosted). Data plane (postgres/redis/minio) runs by
# default; the app + worker are under the `app` profile; Caddy (TLS) is under the
# `edge` profile so a local mirror can skip it. Use via the Makefile.
#
#   make up          # postgres + redis + minio
#   make db-migrate  # dbmate up (as app_owner)
#   make up-app      # + web + worker (local mirror, http://localhost:3000)
#   make up-prod     # + web + worker + caddy (TLS for $APP_DOMAIN)

name: pharmatrack

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pharmatrack}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-app_owner}
      APP_AUTHENTICATED_PASSWORD: ${APP_AUTHENTICATED_PASSWORD:-app_authenticated}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis is a cache + rate-limit/OTP store here, not the source of truth.
    # stop-writes-on-bgsave-error=no keeps it serving writes even if a snapshot
    # fails (e.g. disk pressure) instead of disabling the whole app's Redis path.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--stop-writes-on-bgsave-error", "no"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-56379}:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  # ── App plane (enable after cutover: `make up-app`) ──────────────────────────
  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN:-}
    image: pharmatrack-web:latest
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: "3000"
      # Container-internal endpoints. These OVERRIDE the host-oriented values in
      # .env (localhost:55432 etc., used by `pnpm dev`/tests): inside the compose
      # network the app reaches Postgres/Redis/MinIO by service name. Passwords +
      # db name come from the same vars the postgres service uses, so they stay in
      # sync. .env remains the single source for secrets and the domain URLs.
      DATABASE_URL: postgres://app_owner:${APP_OWNER_PASSWORD:-app_owner}@postgres:5432/${POSTGRES_DB:-pharmatrack}
      DATABASE_AUTHENTICATED_URL: postgres://app_authenticated:${APP_AUTHENTICATED_PASSWORD:-app_authenticated}@postgres:5432/${POSTGRES_DB:-pharmatrack}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports:
      - "3000:3000"

  worker:
    profiles: ["app"]
    image: pharmatrack-web:latest
    restart: unless-stopped
    env_file: ../.env
    command: ["node", "apps/worker/server.js"]
    # Reuses the web image but isn't a web server, so the image's /api/health
    # HEALTHCHECK never passes here — disable it for this service.
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      web: { condition: service_healthy }

  # ── Edge (production TLS) — `make up-prod`. Omitted from the local mirror so it
  #     doesn't bind 80/443 or try to provision a cert for localhost. ───────────
  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: ../.env          # provides APP_DOMAIN for the Caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # CADDYFILE selects the TLS mode: default ../Caddyfile (grey cloud / Let's
      # Encrypt); set CADDYFILE=../Caddyfile.cloudflare in .env for orange cloud
      # (Cloudflare Origin Cert). Origin cert + key go in infra/certs/ (gitignored).
      - ${CADDYFILE:-../Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data       # Let's Encrypt certs live here — keep this volume
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }

volumes:
  pg-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
