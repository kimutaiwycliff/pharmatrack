<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PharmaTrack</title>
<style>
  :root { --bg: #f6f8f7; --surface: #ffffff; --text: #0f172a; --muted: #5b6b66; --green: #16a34a; --border: #e2e8e5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1211; --surface: #121b19; --text: #e7efec; --muted: #9aaba5; --border: #22302d; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: min(380px, calc(100vw - 32px)); text-align: center; box-sizing: border-box; }
  .logo { width: 48px; height: 48px; border-radius: 12px; background: var(--green); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 16px; }
  button { background: var(--green); color: #fff; border: 0; border-radius: 10px; height: 44px; padding: 0 20px; font-weight: 600; font-size: 15px; cursor: pointer; width: 100%; }
  .spin { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: s 0.8s linear infinite; margin: 8px auto 0; }
  @keyframes s { to { transform: rotate(360deg); } }
  .hint { font-size: 13px; margin-top: 14px; margin-bottom: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
    <div id="connecting">
      <h1>Opening PharmaTrack…</h1>
      <div class="spin" role="progressbar" aria-label="Connecting"></div>
    </div>
    <div id="offline" hidden>
      <h1>Waiting for the internet</h1>
      <p>PharmaTrack opens by itself as soon as this Mac is online. It checks every few seconds.</p>
      <button id="retry" type="button">Try again now</button>
      <p class="hint">Once it's open, the till keeps selling through internet outages — closing the window only hides it, so leave it running.</p>
    </div>
  </main>
<script>
  // Desktop launcher (ADR-012): the window starts here, then moves to the hosted
  // app. Offline on Windows we still go: the app's service worker serves the
  // saved till. macOS's webview doesn't run service workers, so there we wait
  // here and open as soon as the internet is back.
  const APP = "https://pharmatrack.co.ke"
  const START = APP + "/home"
  const isMac = /Macintosh|Mac OS X/.test(navigator.userAgent)

  async function reachable() {
    const ctl = new AbortController()
    const t = setTimeout(() => ctl.abort(), 4000)
    try {
      await fetch(APP + "/api/health", { mode: "no-cors", cache: "no-store", signal: ctl.signal })
      return true
    } catch {
      return false
    } finally {
      clearTimeout(t)
    }
  }

  let timer = null
  async function attempt() {
    if (await reachable()) { location.replace(START); return }
    if (!isMac) { location.replace(START); return }
    document.getElementById("connecting").hidden = true
    document.getElementById("offline").hidden = false
    clearTimeout(timer)
    timer = setTimeout(attempt, 5000)
  }
  document.getElementById("retry").addEventListener("click", () => {
    document.getElementById("offline").hidden = true
    document.getElementById("connecting").hidden = false
    attempt()
  })
  window.addEventListener("online", () => attempt())
  attempt()
</script>
</body>
</html>
