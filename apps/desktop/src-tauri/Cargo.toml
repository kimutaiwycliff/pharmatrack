[package]
name = "pharmatrack-desktop"
version = "0.2.1"
description = "PharmaTrack desktop shell"
edition = "2021"

[lib]
name = "pharmatrack_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Desktop till: deadline reminders (pt_notify, src/desktop.rs) and the tray's
# "Start with computer" toggle. Both driven from Rust only.
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ADR-015 — receipt printers on COM/tty ports (USB-serial, Bluetooth SPP).
# No libudev on Linux: we only ship Windows + macOS builds.
serialport = { version = "4", default-features = false }
# ADR-014 — Offline Edition only (see the `offline-edition` feature below).
# tauri-plugin-shell is used purely from Rust (ShellExt::shell().sidecar(...))
# to resolve+spawn the bundled dbmate/node sidecar binaries for the correct
# platform target triple — never exposed to the webview/frontend, so it needs
# no capability/ACL grant.
tauri-plugin-shell = { version = "2", optional = true }
rand = { version = "0.8", optional = true }
url = { version = "2", optional = true }
# ADR-014, Phase 3 — offline license file verification (src/offline/license.rs)
# and the native "pick a license file" / error dialogs it uses. Both Rust-side
# only, same reasoning as tauri-plugin-shell above: no capability/ACL grant
# needed since the webview never calls into either.
tauri-plugin-dialog = { version = "2", optional = true }
ed25519-dalek = { version = "2", optional = true }
# ADR-014 — extracts the vendored resources/web.tar.gz at first run
# (src/offline/web_bundle.rs). Bundled as a single archive instead of loose
# files specifically to avoid Windows's 260-char MAX_PATH during NSIS
# packaging — see fetch-offline-resources.mjs's comment for the full story.
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }

[features]
# Bundles + orchestrates a local Postgres + the Next.js standalone server
# instead of loading the hosted SaaS URL. See src/offline/ and
# docs/adr/ADR-014-offline-edition.md. Off by default — the ordinary
# `tauri build`/`tauri dev` (SaaS webview shell) is unchanged.
offline-edition = ["dep:tauri-plugin-shell", "dep:rand", "dep:url", "dep:tauri-plugin-dialog", "dep:ed25519-dalek", "dep:flate2", "dep:tar"]
