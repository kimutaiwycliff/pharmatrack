# Single-VM deployment (also a good base for a Swarm stack).
#
# Runs the PharmaTrack web app + Redis + a Caddy reverse proxy that terminates
# TLS (automatic Let's Encrypt). Postgres/Auth/Storage come from a self-hosted
# Supabase stack run SEPARATELY (see DEPLOYMENT.md) — point the SUPABASE_* env
# vars at it. The app code is identical for managed vs self-hosted Supabase.
#
# TLS is required, not optional: service workers (offline PWA) and the camera
# barcode scanner only work over HTTPS, and M-Pesa callbacks need a public
# HTTPS URL. Caddy handles certs automatically once DNS points at this VM.
#
# Copy apps/web/.env.local.example to a root .env file and fill it in first.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must be baked at build time (inlined into the browser
      # bundle). Compose interpolates these from the root .env file.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: pharmatrack-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      # Self-hosted cache over the internal docker network (ioredis adapter).
      REDIS_URL: redis://redis:6379
    expose:
      - "3000"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # TLS-terminating reverse proxy. Set APP_DOMAIN in .env (e.g. pos.mypharmacy.co.ke).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # Cron driver — replaces Vercel Cron when self-hosting; hits the reminder
  # endpoint every 15 minutes (set CRON_SECRET in .env).
  reminder-cron:
    image: alpine:3
    restart: unless-stopped
    env_file: .env
    depends_on:
      - web
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1
        while true; do
          curl -s -H "Authorization: Bearer $${CRON_SECRET}" http://web:3000/api/cron/appointment-reminders >/dev/null 2>&1 || true
          sleep 900
        done

volumes:
  redis-data:
  caddy-data:
  caddy-config:
