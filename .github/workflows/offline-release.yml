name: Offline Edition Release

# ADR-014, Phase 4 — manual-only, entirely separate from ci.yml's public
# release jobs: a different R2 bucket (pharmatrack-offline-releases, not
# pharmatrack-releases), different secrets, never referenced by the public
# landing page's download components or its public latest.json.
#
# Builds ONCE PER APP VERSION, not per client — the installer/APK has
# nothing client-specific baked in (licensing happens at first run against
# a separately-issued .ptlicense file, see offline/license.rs and
# src/lib/license.ts), so the same build serves every client. Re-running
# this per sale would burn real money on Windows/macOS runners + EAS cloud
# minutes for a binary that's byte-for-byte identical to the last one —
# ci.yml's own history has a cautionary comment about exactly that mistake
# once burning the whole GitHub Actions spending limit in one manual run.
# Only dispatch this again when the app itself changes (a new version).
#
# Deliberately does NOT sign license files — the signing private key lives
# only in a separate, CI-inaccessible R2 vault bucket (see ADR-014), never a
# CI secret. Sign + upload each client's license file locally:
#   node scripts/generate-offline-license.mjs sign --pharmacy "<name>" --out client.ptlicense
#   aws s3 cp client.ptlicense \
#     s3://pharmatrack-offline-releases/licenses/<slug>/<slug>.ptlicense \
#     --endpoint-url https://<R2_OFFLINE_ACCOUNT_ID>.r2.cloudflarestorage.com
# (the account id is the same value stored in this repo's R2_OFFLINE_ACCOUNT_ID
# secret — check GitHub repo Settings > Secrets if you don't have it handy)

on:
  workflow_dispatch:
    inputs:
      build_desktop:
        description: "Build desktop installers (Windows + macOS)"
        type: boolean
        default: true
      build_android:
        description: "Build the Android APK"
        type: boolean
        default: true

concurrency:
  group: offline-release-${{ github.ref }}
  cancel-in-progress: false

env:
  R2_BUCKET: pharmatrack-offline-releases

jobs:
  desktop-offline-windows:
    name: build offline desktop (Windows)
    if: inputs.build_desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Read desktop app version
        id: meta
        shell: bash
        run: echo "version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # Server-only env vars (OFFLINE_MODE, DATABASE_URL, ...) are read at
      # RUNTIME by the Rust sidecar (see offline/server.rs), not baked into
      # this build — only NEXT_PUBLIC_* values get inlined into the client
      # bundle at build time, same gotcha ci.yml's own web build already
      # works around. Placeholders below mirror that job's build env exactly.
      - name: Build web standalone bundle (offline loopback URL)
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:47831
          BETTER_AUTH_SECRET: offline-build-placeholder-not-used-at-runtime
          DATABASE_URL: postgres://app_owner:app_owner@localhost:5432/pharmatrack
          DATABASE_AUTHENTICATED_URL: postgres://app_authenticated:app_authenticated@localhost:5432/pharmatrack
        run: pnpm build

      - name: Fetch offline resources (Postgres/dbmate/Node sidecars + web bundle)
        working-directory: apps/desktop
        run: node scripts/fetch-offline-resources.mjs --target x86_64-pc-windows-msvc

      - name: Build (tauri build — offline edition, NSIS installer)
        working-directory: apps/desktop
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc --features offline-edition --config src-tauri/tauri.offline.conf.json --bundles nsis

      - name: Upload installer to Cloudflare R2 (offline bucket)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_OFFLINE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_OFFLINE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_OFFLINE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(ls apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          NAME="PharmaTrack_Offline_${VERSION}_x64-setup.exe"
          aws s3 cp "$EXE" "s3://${R2_BUCKET}/desktop-offline/v${VERSION}/${NAME}" --endpoint-url "$R2_ENDPOINT"

  desktop-offline-macos:
    name: build offline desktop (macOS, ${{ matrix.target }})
    if: inputs.build_desktop
    runs-on: macos-latest
    strategy:
      matrix:
        # Two separate per-arch installers, not one universal binary — the
        # vendored Postgres distribution can't be lipo-merged the way Tauri
        # merges its own Rust output (see fetch-offline-resources.mjs).
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Read desktop app version
        id: meta
        run: echo "version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build web standalone bundle (offline loopback URL)
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:47831
          BETTER_AUTH_SECRET: offline-build-placeholder-not-used-at-runtime
          DATABASE_URL: postgres://app_owner:app_owner@localhost:5432/pharmatrack
          DATABASE_AUTHENTICATED_URL: postgres://app_authenticated:app_authenticated@localhost:5432/pharmatrack
        run: pnpm build

      - name: Fetch offline resources (Postgres/dbmate/Node sidecars + web bundle)
        working-directory: apps/desktop
        run: node scripts/fetch-offline-resources.mjs --target ${{ matrix.target }}

      - name: Build (tauri build — offline edition, DMG)
        working-directory: apps/desktop
        run: pnpm exec tauri build --target ${{ matrix.target }} --features offline-edition --config src-tauri/tauri.offline.conf.json --bundles dmg

      - name: Upload installer to Cloudflare R2 (offline bucket)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_OFFLINE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_OFFLINE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_OFFLINE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          DMG=$(ls apps/desktop/src-tauri/target/${TARGET}/release/bundle/dmg/*.dmg)
          NAME="PharmaTrack_Offline_${VERSION}_${TARGET}.dmg"
          aws s3 cp "$DMG" "s3://${R2_BUCKET}/desktop-offline/v${VERSION}/${NAME}" --endpoint-url "$R2_ENDPOINT"

  android-offline:
    name: build offline Android APK
    if: inputs.build_android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build on EAS (offline profile) and wait
        id: eas
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx -y eas-cli build --platform android --profile offline \
            --non-interactive --wait --json > build.json
          cat build.json

          STATUS=$(node -p "require('./build.json')[0].status")
          if [ "$STATUS" != "FINISHED" ]; then
            echo "::error::EAS build did not finish (status=$STATUS) — see the EAS dashboard for logs"
            exit 1
          fi

          echo "url=$(node -p "require('./build.json')[0].artifacts.applicationArchiveUrl")" >> "$GITHUB_OUTPUT"
          APP_VERSION=$(node -p "require('./build.json')[0].appVersion")
          BUILD_VERSION=$(node -p "require('./build.json')[0].appBuildVersion")
          echo "version=${APP_VERSION}-${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download the built APK
        run: curl -fL "${{ steps.eas.outputs.url }}" -o apps/mobile/pharmatrack-offline.apk

      - name: Upload to Cloudflare R2 (offline bucket)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_OFFLINE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_OFFLINE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_OFFLINE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          VERSION: ${{ steps.eas.outputs.version }}
        run: |
          set -euo pipefail
          aws s3 cp apps/mobile/pharmatrack-offline.apk \
            "s3://${R2_BUCKET}/android-offline/v${VERSION}/pharmatrack-offline.apk" \
            --endpoint-url "$R2_ENDPOINT"

  summary:
    name: next steps
    needs: [desktop-offline-windows, desktop-offline-macos, android-offline]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print license reminder
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Offline Edition build uploaded

          Builds are in `pharmatrack-offline-releases` under
          `desktop-offline/v<version>/` and `android-offline/v<version>/`
          (see each job above for its exact version string).

          This workflow never signs a license — sign each client's license
          on your own machine and upload it yourself:

          ```
          node scripts/generate-offline-license.mjs sign --pharmacy "<pharmacy name>" --out <slug>.ptlicense
          aws s3 cp <slug>.ptlicense s3://pharmatrack-offline-releases/licenses/<slug>/<slug>.ptlicense \
            --endpoint-url https://<R2_OFFLINE_ACCOUNT_ID>.r2.cloudflarestorage.com
          ```

          Hand the client both the (already-built, version-generic)
          installer/APK and their own `.ptlicense` file.
          EOF
